[package]
name = "panta-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["bridge-module"]
bridge-module = []

[lints]
workspace = true

# DEP_PANTA_FFI_INCLUDE 只沿普通依赖边注入构建脚本（cargo 1.95/1.98 实测，
# 纯 [build-dependencies] 不注入），因此 panta-ffi 必须留在本表。
[dependencies]
panta-ffi = { path = "../panta-ffi" }

# build.rs 需要在启动前看到 panta-ffi 的 staticlib；普通依赖边仍保留，
# 以便 Cargo 向 launcher build script 注入 DEP_PANTA_FFI_INCLUDE metadata。
# panta-dsl-core（任务 034）在 build.rs 内解析 resources/i18n/*.pa 生成构建
# 树 TS；与 panta-dslc CLI 同一内核，不引入第二套 parser。
[build-dependencies]
panta-ffi = { path = "../panta-ffi" }
panta-dsl-core = { path = "../panta-dsl-core" }
# 托管引导（任务 020）：下载资产的 SHA256 校验。
sha2.workspace = true

# src/provision.rs 的单元测试在测试构建中运行（build.rs 经 #[path] 复用）。
[dev-dependencies]
sha2.workspace = true
