[workspace]
resolver = "3"
members = [
    "crates/launcher",
    "crates/panta-core",
    "crates/panta-dsl-core",
    "crates/panta-dslc",
    "crates/panta-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 承诺支持的最低工具链：跟随首选 CXX release（1.0.202）的 MSRV；
# 日常验证使用 rust-toolchain.toml 固定的 stable 1.98.1。
# resolver 3 的 MSRV 感知依赖解析以该值为准，依赖要求更高时上调并记录原因。
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Yuki-Nagori/panta"

[workspace.dependencies]
cxx = "1.0.202"
cxx-build = "1.0.202"
panta-core = { path = "crates/panta-core" }
pest = "2.8"
pest_derive = "2.8"
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[workspace.lints.rust]
# 默认拒绝 unsafe；唯一例外是 FFI 边界（任务 006）的 CXX 生成胶水，以桥接模块
# 级 allow 放开（位置与安全前提见 crates/panta-ffi/src/lib.rs）。该 allow 只收窄
# 不外扩：新增手写 unsafe 需专用模块并逐块写 // SAFETY:，规范见 standards/rust.md。
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# 测试和 build script 也必须显式处理失败；完整质量入口由任务 011 继续扩展。
unwrap_used = "deny"
expect_used = "deny"
