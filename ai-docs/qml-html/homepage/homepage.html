<!DOCTYPE html>
<!-- panta 桌面主窗口 GUI 框架 · HTML 先行复刻（任务 050）。
     设计参考件，不进 QML 构建图；布局/间距/配色即后续 QML 迁移的
     anchors/Layout 与 Theme token 映射底稿。
     中央内嵌网页视图按需求留空，替换真实内容时映射为 WebEngineView 元素；
     图标为内联 SVG 占位，替换真实图标时映射为图标资源。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panta 2027</title>
<style>
  :root {
    /* 色彩 token */
    --color-chrome-bg: #e9e9e9;
    --color-chrome-line: #d0d0d0;
    --color-menubar-bg: #f3f3f3;
    --color-panel-bg: #fff;
    --color-panel-line: #c9c9c9;
    --color-text: #1c1c1c;
    --color-text-muted: #5a5a5a;
    --color-accent-bg: #cce4f7;
    --color-hover-bg: #e5f1fb;
    --color-search-bg: #5f5f5f;
    --color-search-text: #e6e6e6;
    --color-status-bg: #efefef;
    --color-brand: #c8322b;
    /* 字号 token */
    --font-size-title: 13px;
    --font-size-menu: 13px;
    --font-size-panel: 13px;
    --font-size-small: 12px;
    /* 间距与尺寸 token */
    --space-strip-x: 10px;
    --space-strip-y: 6px;
    --space-panel-x: 12px;
    --size-titlebar-height: 38px;
    --size-menubar-height: 28px;
    --size-ribbon-height: 76px;
    --size-statusbar-height: 26px;
    --size-left-col: 26%;
    --size-output-panel: 42%;
    --radius-ribbon-tile: 4px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  a { color: inherit; text-decoration: none; }

  body {
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: var(--font-size-panel);
    color: var(--color-text);
    background: var(--color-panel-bg);
    overflow: hidden;
  }

  svg { display: block; }

  button {
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: default;
  }

  /* ── 标题工具条 ────────────────────────────────────────── */

  .titlebar {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 14px;
    height: var(--size-titlebar-height);
    padding: 0 var(--space-strip-x);
    background: var(--color-chrome-bg);
    border-bottom: 1px solid var(--color-chrome-line);
  }

  .app-logo {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .app-logo .mark {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    background: var(--color-brand);
    border-radius: 3px;
    color: #fff;
    font-weight: 700;
  }

  .app-logo .edition {
    display: grid;
    color: var(--color-text-muted);
    font-size: 9px;
    line-height: 1.1;
    letter-spacing: 0.06em;
  }

  .quick-icons { display: flex; gap: 4px; }

  .quick-icons button,
  .caption-extra {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .caption-extra button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--color-text-muted);
    white-space: nowrap;
  }

  .caption-extra .signin {
    width: auto;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .quick-icons button:hover,
  .caption-extra button:hover { background: var(--color-hover-bg); }

  .activate {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 3px;
  }

  .activate:hover { background: var(--color-hover-bg); }

  .caption {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: var(--font-size-title);
    color: var(--color-text);
    white-space: nowrap;
    overflow: hidden;
  }

  .caption-search {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 220px;
    height: 26px;
    padding: 0 10px;
    background: var(--color-search-bg);
    border-radius: 3px;
    color: var(--color-search-text);
  }

  .caption-search input {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--color-search-text);
    font-size: var(--font-size-small);
    outline: none;
  }

  .signin { display: flex; align-items: center; gap: 5px; }

  .window-controls { display: flex; gap: 2px; margin-left: 4px; }

  .window-controls button {
    width: 30px;
    height: 26px;
    display: grid;
    place-items: center;
    color: var(--color-text);
  }

  .window-controls button.close:hover { background: #e81123; color: #fff; }

  /* ── 菜单栏 ────────────────────────────────────────────── */

  .menubar {
    display: flex;
    gap: 2px;
    height: var(--size-menubar-height);
    align-items: center;
    padding: 0 var(--space-strip-x);
    background: var(--color-menubar-bg);
    border-bottom: 1px solid var(--color-chrome-line);
  }

  .menubar button { padding: 4px 10px; border-radius: 3px; }

  .menubar button:hover { background: var(--color-hover-bg); }

  .menubar .hotkey { color: var(--color-text-muted); margin-left: 2px; }

  /* ── Ribbon 启动区 ─────────────────────────────────────── */

  .ribbon {
    display: flex;
    gap: 6px;
    align-items: stretch;
    height: var(--size-ribbon-height);
    padding: 6px var(--space-strip-x);
    background: var(--color-chrome-bg);
    border-bottom: 1px solid var(--color-chrome-line);
  }

  .ribbon-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 68px;
    padding: 6px 12px;
    border-radius: var(--radius-ribbon-tile);
    color: var(--color-text);
  }

  .ribbon-tile:hover { background: var(--color-hover-bg); }

  .ribbon-tile .label { font-size: var(--font-size-small); }

  /* ── 工作区 ────────────────────────────────────────────── */

  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .left-col {
    display: flex;
    flex-direction: column;
    width: var(--size-left-col);
    min-width: 320px;
    border-right: 1px solid var(--color-panel-line);
  }

  .tasks-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--color-panel-bg);
  }

  .panel-tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 4px var(--space-panel-x) 0;
    background: var(--color-chrome-bg);
    border-bottom: 1px solid var(--color-panel-line);
  }

  .panel-tabs .tab {
    padding: 5px 12px;
    border: 1px solid var(--color-panel-line);
    border-bottom: 0;
    border-radius: 4px 4px 0 0;
    background: var(--color-chrome-bg);
    color: var(--color-text-muted);
    transform: translateY(1px);
  }

  .panel-tabs .tab.active {
    background: var(--color-panel-bg);
    color: var(--color-text);
    font-weight: 600;
  }

  .task-list { flex: 1; overflow: auto; padding: 8px 0; }

  .task-list .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px var(--space-panel-x);
  }

  .task-list .item:hover { background: var(--color-hover-bg); }

  .task-list .item .dim { color: var(--color-text-muted); }

  .output-panel {
    height: var(--size-output-panel);
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--color-panel-line);
    background: var(--color-panel-bg);
  }

  .output-toolbar {
    display: flex;
    gap: 2px;
    padding: 3px var(--space-panel-x);
    background: var(--color-chrome-bg);
    border-bottom: 1px solid var(--color-panel-line);
  }

  .output-toolbar button {
    width: 24px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--color-text-muted);
  }

  .output-toolbar button:hover { background: var(--color-hover-bg); }

  .output-body { flex: 1; }

  /* 内嵌网页视图：按需求留空，迁移时映射为 WebEngineView */
  .web-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-left: 1px solid var(--color-panel-line);
    background: var(--color-panel-bg);
  }

  .pane-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 var(--space-strip-x);
    background: var(--color-chrome-bg);
    border-bottom: 1px solid var(--color-chrome-line);
  }

  .pane-toolbar button {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--color-text-muted);
  }

  .pane-toolbar button:hover { background: var(--color-hover-bg); }

  .pane-address {
    flex: 1;
    height: 24px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    background: var(--color-panel-bg);
    border: 1px solid var(--color-panel-line);
    border-radius: 3px;
    color: var(--color-text-muted);
    font-size: var(--font-size-small);
  }

  .pane-content { flex: 1; background: var(--color-panel-bg); }

  .pane-status {
    height: 22px;
    background: var(--color-chrome-bg);
    border-top: 1px solid var(--color-chrome-line);
  }

  /* ── 状态栏 ────────────────────────────────────────────── */

  .statusbar {
    display: flex;
    align-items: center;
    height: var(--size-statusbar-height);
    padding: 0 var(--space-strip-x);
    background: var(--color-status-bg);
    border-top: 1px solid var(--color-chrome-line);
    color: var(--color-text-muted);
    font-size: var(--font-size-small);
  }
</style>
</head>
<body>

<header class="titlebar">
  <span class="app-logo">
    <span class="mark">P</span>
    <span class="edition">SIM<span>CAE</span></span>
  </span>
  <span class="quick-icons">
    <button aria-label="新建"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 1.5h6l3 3v9H3z" stroke="currentColor" stroke-width="1.2"/><path d="M7.5 6v4M5.5 8h4" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button aria-label="打开"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1.5 3.5h4l1.5 2h6.5v7h-12z" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button aria-label="保存"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2h9l2 2v9H2z" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 2v4h5V2M4.5 13V9h6v4" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button aria-label="打印"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M4 5V2h7v3M2 5h11v5h-2M4 8h7v5H4z" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button aria-label="打印预览"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="2" y="2" width="11" height="11" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M5 8l2 2 3-4" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </span>
  <button class="activate">激活动图(A)
    <svg width="9" height="6" viewBox="0 0 9 6" fill="none"><path d="M1 1l3.5 3.5L8 1" stroke="currentColor" stroke-width="1.3"/></svg>
  </button>
  <span class="caption">panta 2027</span>
  <span class="caption-search">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M11 11l3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="search" placeholder="输入关键字或词语" aria-label="搜索">
  </span>
  <span class="caption-extra">
    <button class="signin" aria-label="登录">
      <svg width="14" height="14" viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="5.6" r="2.9" stroke="currentColor" stroke-width="1.3"/><path d="M2.8 14.6c.8-3 3-4.5 5.7-4.5s4.9 1.5 5.7 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>登录
    </button>
    <button aria-label="购物车"><svg width="14" height="14" viewBox="0 0 18 18" fill="none"><path d="M2 3h2l1.6 8.4a1 1 0 0 0 1 .8h6.9a1 1 0 0 0 1-.8L15.8 6H4.6" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="15" r="1" fill="currentColor"/><circle cx="13" cy="15" r="1" fill="currentColor"/></svg></button>
    <button aria-label="帮助">?</button>
  </span>
  <span class="window-controls">
    <button aria-label="最小化"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M1 5.5h9" stroke="currentColor" stroke-width="1.1"/></svg></button>
    <button aria-label="最大化"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1.5" y="1.5" width="8" height="8" stroke="currentColor" stroke-width="1.1"/></svg></button>
    <button class="close" aria-label="关闭"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1.1"/></svg></button>
  </span>
</header>

<nav class="menubar">
  <button>开始并学习<span class="hotkey">(S)</span></button>
  <button>社区<span class="hotkey">(C)</span></button>
  <button>工具<span class="hotkey">(T)</span></button>
  <button>查看<span class="hotkey">(V)</span></button>
</nav>

<section class="ribbon">
  <button class="ribbon-tile">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="4" y="4" width="20" height="20" rx="4" fill="#c8322b"/><path d="M11.5 9.5l7 4.5-7 4.5z" fill="#fff"/></svg>
    <span class="label">启动</span>
  </button>
  <button class="ribbon-tile">
    <svg width="28" height="28" viewBox="0 0 26 26" fill="none"><path d="M13 3a7 7 0 0 1 4 12.7c-.8.6-1 1.4-1 2.3h-6c0-.9-.2-1.7-1-2.3A7 7 0 0 1 13 3z" fill="#f5c518" stroke="#4a4a4a" stroke-width="1.2" stroke-linejoin="round"/><path d="M10.5 21h5M11.5 23.5h3" stroke="#4a4a4a" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span class="label">新功能</span>
  </button>
  <button class="ribbon-tile">
    <svg width="28" height="28" viewBox="0 0 26 26" fill="none"><path d="M3 9l10-5 10 5-10 5z" fill="#fff" stroke="#4a4a4a" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 11.5V17c0 1.6 2.7 3 6 3s6-1.4 6-3v-5.5" stroke="#4a4a4a" stroke-width="1.4"/><path d="M23 9v6" stroke="#c8322b" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="label">学习</span>
  </button>
</section>

<div class="workspace">
  <div class="left-col">
    <section class="tasks-panel">
      <div class="panel-tabs">
        <span class="tab active">任务</span>
        <span class="tab">工具</span>
        <span class="tab">共享视图</span>
      </div>
      <div class="task-list">
        <a class="item" href="#">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1.5 3.5h4l1.5 2h6.5v7h-12z" stroke="#4a4a4a" stroke-width="1.2"/></svg>
          打开工程<span class="dim">...</span>
        </a>
        <a class="item" href="#">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 1.5h6l3 3v9H3z" stroke="#4a4a4a" stroke-width="1.2"/><path d="M7.5 6v4M5.5 8h4" stroke="#4a4a4a" stroke-width="1.2"/></svg>
          新建工程<span class="dim">...</span>
        </a>
      </div>
    </section>
    <section class="output-panel">
      <div class="output-toolbar">
        <button aria-label="新建输出"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M3 1.5h6l3 3v9H3z" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button aria-label="打开输出"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M1.5 3.5h4l1.5 2h6.5v7h-12z" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button aria-label="检查"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M2.5 8l3 3 7-7.5" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button aria-label="向导"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M8 1.5l1.4 3.6L13 6.5l-3.6 1.4L8 11.5 6.6 7.9 3 6.5l3.6-1.4z" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button aria-label="清除"><svg width="13" height="13" viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button aria-label="复制"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1.2"/><rect x="5" y="5" width="8" height="8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button aria-label="图像"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" stroke="currentColor" stroke-width="1.2"/><circle cx="5" cy="6" r="1.2" fill="currentColor"/><path d="M3 11l3.5-3.5 2.5 2 2-2 3 3.5" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button aria-label="导出"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M7.5 2v8M4.5 7l3 3 3-3" stroke="currentColor" stroke-width="1.3"/><path d="M2 12.5h11" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button aria-label="删除"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M2.5 4h10M5.5 4V2.5h4V4M4 4l1 9h5l1-9" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
      <div class="output-body"></div>
    </section>
  </div>

  <section class="web-pane">
    <div class="pane-toolbar">
      <button aria-label="后退"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8 2L3.5 6.5 8 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button aria-label="前进"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 2l4.5 4.5L5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button aria-label="刷新"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M11 6.5A4.5 4.5 0 1 1 6.5 2c1.8 0 3.2.9 4 2.2M10.5 1v3.2H7.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <button aria-label="主页"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 6.5L6.5 2l5 4.5M2.8 5.8V11h7.4V5.8" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <span class="pane-address"></span>
    </div>
    <div class="pane-content"></div>
    <div class="pane-status"></div>
  </section>
</div>

<footer class="statusbar">就绪</footer>

</body>
</html>
