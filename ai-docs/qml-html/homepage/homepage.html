<!DOCTYPE html>
<!-- 启动 / 学习首页；公共壳层由上一级目录提供，任务 059。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>panta 2027</title>
  <link rel="stylesheet" href="../shell.css">
  <script src="../shell.js" defer></script>
</head>
<body>
<template id="page-menu">
  <button type="button" aria-current="page">Start &amp; Learn</button>
  <button type="button">Community</button>
  <button type="button">Tools</button>
  <button type="button">View</button>
</template>

<template id="page-ribbon">
  <section class="ribbon" aria-label="Start and Learn tools">
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="New Project">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-project"/></svg>
          <span class="label">New<br>Project</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Open Project">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-open-project"/></svg>
          <span class="label">Open<br>Project</span>
        </button>
      </div>
      <span class="ribbon-label">Start <svg class="icon caret" aria-hidden="true" focusable="false"><use href="#i-caret"/></svg></span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="New Features">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-new-features"/></svg>
          <span class="label">New<br>Features</span>
        </button>
      </div>
      <span class="ribbon-label">New Features</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Start Here">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-start-here"/></svg>
          <span class="label">Start Here</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Tutorials">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-tutorials"/></svg>
          <span class="label">Tutorials</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Videos">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-videos"/></svg>
          <span class="label">Videos</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Help">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-help"/></svg>
          <span class="label">Help</span>
        </button>
      </div>
      <span class="ribbon-label">Learn</span>
    </div>
  </section>
</template>

<template id="page-tasks">
  <button type="button" class="task-item"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-open"/></svg>Open Project<span class="suffix">…</span></button>
  <button type="button" class="task-item"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-new"/></svg>New Project<span class="suffix">…</span></button>
</template>
<noscript>This design reference requires JavaScript to display the shared layout.</noscript>
</body>
</html>
