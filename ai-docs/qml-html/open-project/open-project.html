<!DOCTYPE html>
<!-- 打开工程状态；公共壳层由上一级目录提供，任务 059/063。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>panta 2027 · Project '01'</title>
  <link rel="stylesheet" href="../shell.css">
  <script src="../shell.js" defer></script>
</head>
<body class="project-workspace">
<template id="page-menu">
  <button type="button" aria-current="page">Home</button>
  <button type="button">Tools</button>
  <button type="button">View</button>
  <button type="button">Geometry</button>
  <button type="button">Mesh</button>
  <button type="button">Boundary Conditions</button>
  <button type="button">Optimization</button>
  <button type="button">Results</button>
  <button type="button">Reports</button>
  <button type="button">Start &amp; Learn</button>
  <button type="button">Community</button>
</template>

<template id="page-ribbon">
  <section class="ribbon" aria-label="Project tools">
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Import" data-file-picker="stl">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-import"/></svg>
          <span class="label">Import</span>
        </button>
      </div>
      <span class="ribbon-label">Import</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Add">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-add"/></svg>
          <span class="label">Add</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Dual Domain">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-dual-domain"/></svg>
          <span class="label">Dual<br>Domain</span>
          <svg class="icon caret" aria-hidden="true" focusable="false"><use href="#i-caret"/></svg>
        </button>
        <button type="button" class="ribbon-button" aria-label="Geometry">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-geometry"/></svg>
          <span class="label">Geometry</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Mesh">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-mesh"/></svg>
          <span class="label">Mesh</span>
        </button>
      </div>
      <span class="ribbon-label">Create</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Thermoplastics Injection Molding">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-thermoplastics-injection-molding"/></svg>
          <span class="label">Thermoplastics<br>Injection Molding</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Analysis Sequence">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-analysis-sequence"/></svg>
          <span class="label">Analysis<br>Sequence</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Select Material">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-select-material"/></svg>
          <span class="label">Select<br>Material</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Injection Locations">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-injection-locations"/></svg>
          <span class="label">Injection<br>Locations</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Process Settings">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-process-settings"/></svg>
          <span class="label">Process<br>Settings</span>
        </button>
      </div>
      <span class="ribbon-label">Molding Process Setup</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Optimization">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-optimization"/></svg>
          <span class="label">Optimization</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Boundary Conditions">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-boundary-conditions"/></svg>
          <span class="label">Boundary<br>Conditions</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Analyze" disabled>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-analyze"/></svg>
          <span class="label">Analyze</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Logs">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-logs"/></svg>
          <span class="label">Logs</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Job Manager">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-job-manager"/></svg>
          <span class="label">Job<br>Manager</span>
        </button>
      </div>
      <span class="ribbon-label">Results</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Results">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-results"/></svg>
          <span class="label">Results</span>
        </button>
        <button type="button" class="ribbon-button" aria-label="Reports">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-reports"/></svg>
          <span class="label">Reports</span>
        </button>
      </div>
      <span class="ribbon-label">Reporting</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Shared Views">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-shared-views"/></svg>
          <span class="label">Shared<br>Views</span>
        </button>
      </div>
      <span class="ribbon-label">Share</span>
    </div>
  </section>
</template>

<template id="page-tasks">
  <div role="tree" aria-label="Project tree">
    <button type="button" class="task-item" role="treeitem" aria-selected="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-project-file"/></svg><span>Project '01'</span></button>
  </div>
</template>
<template id="page-dialog">
  <div class="modal-backdrop" data-dialog-panel="import" hidden>
    <section class="dialog import-dialog" role="dialog" aria-modal="true" aria-labelledby="import-title">
      <header class="dialog-titlebar">
        <h2 id="import-title">Import</h2>
        <button type="button" class="dialog-close" data-dialog-close aria-label="Close dialog" title="Close dialog"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button>
      </header>
      <div class="dialog-body import-body">
        <div class="import-main">
          <p class="dialog-intro">Selected files will be added to this project as separate parts. Choose the mesh type and units to apply to all of them:</p>
          <div class="form-grid import-form-grid">
            <label for="mesh-type">Mesh type</label>
            <select id="mesh-type">
              <option>Midplane</option>
              <option selected>Dual Domain</option>
              <option>Solid 3D</option>
            </select>
            <label for="mesh-units">Units</label>
            <select id="mesh-units">
              <option selected>Millimeters</option>
              <option>Centimeters</option>
              <option>Inches</option>
            </select>
          </div>
          <p class="import-warning">The units for this file are not specified. Select the units used by the STL source.</p>
          <p class="import-selection-count" data-import-count>2 files selected</p>
          <ul class="import-file-list" data-import-files aria-label="Selected STL files">
            <li>housing.stl</li>
            <li>cover.stl</li>
          </ul>
          <p class="dimensions"><span>Approximate dimensions:</span><strong>Previewed for each selected file</strong></p>
          <label class="checkbox-row"><input type="checkbox" checked><span>Show import log</span></label>
        </div>
        <div class="dialog-actions import-actions">
          <button type="button" class="dialog-primary" data-demo-navigate="../imported-project/imported-project.html">OK</button>
          <button type="button" class="dialog-secondary" data-dialog-close>Cancel</button>
          <button type="button" class="dialog-secondary">Help</button>
        </div>
      </div>
      <input class="visually-hidden" type="file" accept=".stl" multiple data-import-file-input="stl" aria-label="Choose one or more STL files">
    </section>
  </div>
</template>
<noscript>This design reference requires JavaScript to display the shared layout.</noscript>
</body>
</html>
