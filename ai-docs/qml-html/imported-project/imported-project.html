            <option>Fill</option>
            <option>Fill + Pack</option>
            <option>Fast Fill</option>

            <option>Cool</option>

          <button type="button" data-dialog-close>Cancel</button>
          <button type="button" disabled>More...</button>

        <div class="material-list-row">
          <select size="3" data-material-common aria-label="Commonly used materials"><option selected>PP — 25% mineral filler</option></select>
          <button type="button" disabled>Remove</button>
        </div>
        <div class="material-list-row">
          <label class="material-mode"><input type="radio" name="material-mode" value="specific" data-material-mode> Specific material</label>
          <div class="material-list-actions"><button type="button" disabled>Customize Material List...</button><button type="button" disabled>Reset Material List</button></div>
        </div>

          <label for="material-family">Polymer family</label>

          <button type="button" disabled>Import...</button>
          <label for="material-choice">Material</label>

          <button type="button" disabled>Search...</button>
        </div>

          <p class="material-name">PP — 25% mineral filler</p>
          <div class="material-detail-actions">
            <button type="button" data-material-details aria-expanded="false" aria-controls="material-properties">Details...</button>
            <button type="button" disabled>Report...</button>
          </div>

            <dt>Mineral filler</dt><dd>25%</dd>
            <dt>Recommended melt temperature</dt><dd>180–220 °C</dd>
            <dt>Recommended mold temperature</dt><dd>40–80 °C</dd>
            <dt>Ejection temperature</dt><dd>110 °C</dd>
            <dt>Maximum shear stress</dt><dd>250 kPa</dd>
            <dt>Maximum shear rate</dt><dd>100000 s⁻¹</dd>
          </dl>
          <label class="checkbox-row material-favorite"><input type="checkbox" disabled> Add material to commonly used list after selecting</label>
        </fieldset>
        <div class="dialog-actions"><button type="button" class="dialog-primary" data-material-accept>OK</button><button type="button" data-dialog-close>Cancel</button><button type="button" disabled>Help</button></div>
      </div>
    </section>
  </div>
  <div class="modal-backdrop" data-dialog-panel="process-settings" hidden>
    <section class="dialog process-dialog" role="dialog" aria-modal="true" aria-labelledby="process-title">
      <div class="dialog-titlebar"><h2 id="process-title">Process Settings · Fill</h2><button type="button" class="dialog-close" data-dialog-close aria-label="Close dialog">×</button></div>
      <form class="dialog-body process-body" data-process-form>
        <fieldset class="process-section">
          <legend>Temperatures</legend>
          <div class="process-temperature-grid">
            <label>Mold surface temperature<span class="process-unit-input"><input name="moldTemperature" type="number" step="any" value="40" required><span>°C</span></span></label>
            <label>Melt temperature<span class="process-unit-input"><input name="meltTemperature" type="number" step="any" value="230" required><span>°C</span></span></label>
          </div>
        </fieldset>
        <fieldset class="process-section">
          <legend>Filling &amp; switch-over</legend>
          <div class="process-control-grid">
            <label for="filling-control">Filling control</label><select id="filling-control"><option>Flow rate</option></select>
            <span class="process-unit-input"><input name="flowRate" type="number" min="0.001" step="any" value="94.7" aria-label="Flow rate" required><span>cm³/s</span></span>
            <label for="switch-control">Velocity/pressure switch-over</label><select id="switch-control"><option>By volume filled</option></select>
            <span class="process-unit-input"><input name="switchVolume" type="number" min="0" max="100" step="any" value="99" aria-label="Volume filled" required><span>%</span></span>
          </div>
        </fieldset>
        <fieldset class="process-section">
          <legend>Pack/holding control</legend>
          <div class="process-profile-control"><select aria-label="Pack/holding control"><option>Filling pressure vs time (%)</option></select><button type="button" data-dialog="holding-profile">Edit Profile…</button></div>
          <p class="dialog-note" data-profile-summary>100% filling pressure · 10 s</p>
        </fieldset>
        <fieldset class="process-section">
          <legend>Analysis options</legend>
          <label class="checkbox-row"><input name="fiberOrientation" type="checkbox" checked>Fiber orientation analysis if fiber material</label>
          <label class="checkbox-row"><input name="crystallization" type="checkbox">Crystallization analysis (requires material data)</label>
          <div class="process-secondary-actions"><button type="button" disabled>Advanced Options…</button><button type="button" disabled>Fiber Solver Parameters…</button></div>
        </fieldset>
        <div class="dialog-actions"><button type="submit" class="dialog-primary">OK</button><button type="button" data-dialog-close>Cancel</button><button type="button" disabled>Help</button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop" data-dialog-panel="gate-location-settings" hidden>
    <section class="dialog process-dialog" role="dialog" aria-modal="true" aria-labelledby="gate-location-title">
      <div class="dialog-titlebar"><h2 id="gate-location-title">Process Settings · Gate Location</h2><button type="button" class="dialog-close" data-dialog-close aria-label="Close dialog">×</button></div>
      <form class="dialog-body process-body" data-gate-location-form>
        <fieldset class="process-section">
          <legend>Injection molding machine</legend>
          <div class="gate-machine-control"><select name="machineId" aria-label="Injection molding machine"><option value="default-machine">Default machine</option></select><button type="button" disabled>Edit…</button><button type="button" disabled>Select…</button></div>
        </fieldset>
        <fieldset class="process-section">
          <legend>Temperatures</legend>
          <div class="process-temperature-grid">
            <label>Mold surface temperature<span class="process-unit-input"><input name="moldTemperature" type="number" min="-273.15" step="any" value="40" required><span>°C</span></span></label>
            <label>Melt temperature<span class="process-unit-input"><input name="meltTemperature" type="number" min="-273.15" step="any" value="230" required><span>°C</span></span></label>
          </div>
        </fieldset>
        <fieldset class="process-section">
          <legend>Gate locator</legend>
          <div class="gate-locator-grid">
            <label>Algorithm<select name="algorithm"><option value="advanced-gate-locator">Advanced gate locator</option></select></label>
            <label>Number of gates<span class="process-unit-input"><input name="numberOfGates" type="number" min="1" max="10" step="1" value="1" required><span>1–10</span></span></label>
          </div>
          <div class="process-secondary-actions"><button type="button" disabled>Advanced Options…</button></div>
        </fieldset>
        <div class="dialog-actions"><button type="submit" class="dialog-primary">OK</button><button type="button" data-dialog-close>Cancel</button><button type="button" disabled>Help</button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop profile-backdrop" data-dialog-panel="holding-profile" hidden>
    <section class="dialog profile-dialog" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <div class="dialog-titlebar"><h2 id="profile-title">Pack/Holding Control Profile</h2><button type="button" class="dialog-close" data-dialog-close aria-label="Close dialog">×</button></div>
      <form class="dialog-body process-body" data-profile-form>
        <p class="dialog-intro">Filling pressure vs time (%)</p>
        <div class="profile-table-scroll"><table class="profile-table"><thead><tr><th scope="col">Step</th><th scope="col">Duration <span>s · ≥ 0</span></th><th scope="col">Filling pressure <span>% · 0–200</span></th><th scope="col"><span class="profile-remove-heading">Remove</span></th></tr></thead><tbody data-profile-rows></tbody></table></div>
        <div class="profile-toolbar"><button type="button" data-profile-add>Add Step</button><button type="button" disabled>Import Profile…</button><button type="button" data-profile-plot aria-expanded="false" aria-controls="profile-plot">Plot Profile</button></div>
        <figure class="profile-plot" id="profile-plot" hidden><svg viewBox="0 0 440 150" role="img" aria-label="Filling pressure over cumulative time"><path class="profile-axis" d="M40 10V120H425"/><polyline data-profile-line/><text x="40" y="142">0 s</text><text x="425" y="142" text-anchor="end" data-profile-end-time></text><text x="4" y="18">200%</text></svg><figcaption>Pressure vs cumulative time</figcaption></figure>
        <div class="dialog-actions"><button type="submit" class="dialog-primary">OK</button><button type="button" data-dialog-close>Cancel</button><button type="button" disabled>Help</button></div>
      </form>
    </section>
  </div>
</template>

<noscript>This design reference requires JavaScript to display the shared layout.</noscript>
</body>
</html>
