<!DOCTYPE html>
<!-- Mesh Tool 的布局参考；实际功能与导航信号由后续 QML task 接入。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>panta 2027 · Mesh Tool</title>
  <link rel="stylesheet" href="../shell.css">
  <script src="../shell.js" defer></script>
</head>
<body class="project-workspace mesh-tool-workspace" data-panel-tab="tools">
<template id="page-menu">
  <button type="button" aria-current="page">Home</button>
  <button type="button">Tools</button>
  <button type="button">View</button>
  <button type="button">Geometry</button>
  <button type="button">Mesh</button>
  <button type="button">Boundary Conditions</button>
  <button type="button">Optimization</button>
  <button type="button">Results</button>
  <button type="button">Reports</button>
  <button type="button">Start &amp; Learn</button>
  <button type="button">Community</button>
</template>

<template id="page-ribbon">
  <section class="ribbon" aria-label="Project tools">
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Import"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-import"/></svg><span class="label">Import</span></button>
      </div>
      <span class="ribbon-label">Import</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Add"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-add"/></svg><span class="label">Add</span></button>
        <button type="button" class="ribbon-button" aria-label="Dual Domain"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-dual-domain"/></svg><span class="label">Dual<br>Domain</span><svg class="icon caret" aria-hidden="true" focusable="false"><use href="#i-caret"/></svg></button>
        <button type="button" class="ribbon-button" aria-label="Geometry"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-geometry"/></svg><span class="label">Geometry</span></button>
        <button type="button" class="ribbon-button" aria-label="Mesh"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-mesh"/></svg><span class="label">Mesh</span></button>
      </div>
      <span class="ribbon-label">Create</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Thermoplastics Injection Molding"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-thermoplastics-injection-molding"/></svg><span class="label">Thermoplastics<br>Injection Molding</span></button>
        <button type="button" class="ribbon-button" aria-label="Analysis Sequence"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-analysis-sequence"/></svg><span class="label">Analysis<br>Sequence</span></button>
        <button type="button" class="ribbon-button" aria-label="Select Material"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-select-material"/></svg><span class="label">Select<br>Material</span></button>
        <button type="button" class="ribbon-button" aria-label="Injection Locations"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-injection-locations"/></svg><span class="label">Injection<br>Locations</span></button>
        <button type="button" class="ribbon-button" aria-label="Process Settings"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-process-settings"/></svg><span class="label">Process<br>Settings</span></button>
      </div>
      <span class="ribbon-label">Molding Process Setup</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Optimization"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-optimization"/></svg><span class="label">Optimization</span></button>
        <button type="button" class="ribbon-button" aria-label="Boundary Conditions"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-boundary-conditions"/></svg><span class="label">Boundary<br>Conditions</span></button>
        <button type="button" class="ribbon-button" aria-label="Analyze" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-analyze"/></svg><span class="label">Analyze</span></button>
        <button type="button" class="ribbon-button" aria-label="Logs"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-logs"/></svg><span class="label">Logs</span></button>
        <button type="button" class="ribbon-button" aria-label="Job Manager"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-job-manager"/></svg><span class="label">Job<br>Manager</span></button>
      </div>
      <span class="ribbon-label">Results</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Results"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-results"/></svg><span class="label">Results</span></button>
        <button type="button" class="ribbon-button" aria-label="Reports"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-reports"/></svg><span class="label">Reports</span></button>
      </div>
      <span class="ribbon-label">Reporting</span>
    </div>
    <div class="ribbon-group">
      <div class="ribbon-tools">
        <button type="button" class="ribbon-button" aria-label="Shared Views"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ribbon-shared-views"/></svg><span class="label">Shared<br>Views</span></button>
      </div>
      <span class="ribbon-label">Share</span>
    </div>
  </section>
</template>

<template id="page-tools">
  <section class="mesh-tool-page" aria-label="Mesh Tool">
    <div class="mesh-tool-mode-row">
      <label class="mesh-tool-mode">
        <span class="visually-hidden">Mesh operation</span>
        <select aria-label="Mesh operation">
          <option selected>Generate Mesh</option>
        </select>
        <kbd aria-label="Keyboard shortcut F2">F2</kbd>
        <span class="mesh-tool-select-arrow" aria-hidden="true"></span>
      </label>
      <button type="button" class="mesh-tool-more" aria-label="More mesh options" title="More options">…</button>
    </div>

    <div class="mesh-tool-actions" role="group" aria-label="Mesh actions">
      <button type="button" class="mesh-primary">Mesh</button>
      <button type="button">Help</button>
      <button type="button">Preview</button>
      <button type="button" data-demo-navigate="../imported-project/imported-project.html">Cancel</button>
    </div>

    <div class="mesh-tool-checks">
      <label class="checkbox-row"><input type="checkbox">Remesh already meshed parts of the model</label>
      <label class="checkbox-row"><input type="checkbox">Place mesh in active layer</label>
    </div>

    <div class="mesh-tool-general">
      <div class="mesh-tool-tabs" role="tablist" aria-label="Mesh settings">
        <button type="button" id="mesh-general-tab" class="mesh-tool-tab" role="tab" aria-controls="mesh-general-settings" aria-selected="true" tabindex="0">General</button>
      </div>

      <section id="mesh-general-settings" class="mesh-tool-settings" role="tabpanel" aria-labelledby="mesh-general-tab">
        <p class="mesh-tool-description">Set curve edge lengths on the Curves tab. Set CAD edge lengths on the CAD tab or in Mesh &gt; Density. The global edge length applies when geometry has no local edge length.</p>

        <div class="mesh-tool-global-length">
          <label for="global-edge-length">Global edge length:</label>
          <div class="mesh-tool-number">
            <input id="global-edge-length" type="number" value="12.00" min="0" step="0.01" inputmode="decimal">
            <span>mm</span>
          </div>
        </div>

        <div class="mesh-tool-options">
          <label class="checkbox-row"><input type="checkbox" checked>* Match mesh</label>
          <label class="checkbox-row"><input type="checkbox" checked>* Calculate thickness for Dual Domain meshes</label>
        </div>
      </section>
    </div>
  </section>
</template>

<template id="page-layers"></template>
<template id="page-layer-tab"></template>

<noscript>This design reference requires JavaScript to display the shared layout.</noscript>
</body>
</html>
