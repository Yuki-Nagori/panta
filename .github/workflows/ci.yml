# 质量与构建门禁（任务 011/018/032/043/046）。公共步骤封装在
# .github/actions/*：changed-paths（路径分类门控）、panta-toolchain、
# linux-gl-prereqs、panta-cache-restore / panta-cache-save（缓存两键，
# 仅 check 在 main push 保存，其余 job 只恢复）。
# - changes：按变更路径拆分触发，未知路径一律保守触发全量检查；
# - check：唯一跨平台 job；每个平台都执行 check、build、测试套件与工具核验；
# - lint：Ubuntu 上每个工具独立成一个矩阵检查，失败项可直接定位，按域触发；
# - format：Ubuntu 上通过 cargo format --check 检查 Rust、C++/CXX、CMake、QML；
# - dependency-audit：仅在依赖清单/审计配置变更时运行；
# - coverage：Ubuntu 上分别执行 Rust 门禁与 native C++ 插桩报告与 QML 行为测试。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed paths (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cargo_deps: ${{ steps.filter.outputs.cargo_deps }}
      rust: ${{ steps.filter.outputs.rust }}
      native: ${{ steps.filter.outputs.native }}
      qml: ${{ steps.filter.outputs.qml }}
    steps:
      # 本地 composite action 的解析依赖工作区已有仓库，checkout 必须在
      # 调用前完成；分类需要全量历史取 merge-base/before diff。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-paths

  dependency-audit:
    name: cargo audit (ubuntu)
    needs: [changes]
    if: needs.changes.outputs.cargo_deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain

      - uses: ./.github/actions/panta-cache-restore
        with:
          tools_deps: "false"

      - name: Dependency and license audit
        shell: bash
        run: cargo audit

  lint:
    name: cargo lint (${{ matrix.tool }}, ubuntu)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        tool: [clippy, clang-tidy, includes, cppcheck]
    runs-on: ubuntu-latest
    # 冷启动需供给 LLVM/Qt 并构建 native 树；上限防传输停滞拖满平台上限。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain
        with:
          components: "rustfmt,clippy"

      # 这些工具都经由 launcher 构建脚本触发 native 配置；供给 Qt 的
      # find_package(Gui) 经 WrapOpenGL 强依赖宿主 GL 开发文件。
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gl-prereqs

      - uses: ./.github/actions/panta-cache-restore

      - name: Run selected lint
        shell: bash
        run: cargo lint "${{ matrix.tool }}" --check

  # machete 只读 Rust 清单与源码，不进 native 构建图：按 rust 域触发，
  # 且不需要托管工具/依赖缓存。
  lint-machete:
    name: cargo lint (machete, ubuntu)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain

      - uses: ./.github/actions/panta-cache-restore
        with:
          tools_deps: "false"

      - name: Run cargo machete
        shell: bash
        run: cargo lint machete --check

  # cmake-lint 只检查 native CMake 文件：按 native 域触发。
  lint-cmake:
    name: cargo lint (cmake, ubuntu)
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain

      - uses: ./.github/actions/panta-cache-restore

      - name: Run cmake lint
        shell: bash
        run: cargo lint cmake --check

  # qmllint 消费 Qt 供给与 QML/bridge 输出：按 qml 或 native 域触发。
  lint-qmllint:
    name: cargo lint (qmllint, ubuntu)
    needs: [changes]
    if: needs.changes.outputs.qml == 'true' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gl-prereqs

      - uses: ./.github/actions/panta-cache-restore

      - name: Run qmllint
        shell: bash
        run: cargo lint qmllint --check

  format:
    name: cargo format (ubuntu)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain
        with:
          components: "rustfmt"

      - uses: ./.github/actions/panta-cache-restore

      - name: Run aggregated cargo format check (Rust, C++/CXX, CMake and QML)
        shell: bash
        run: cargo format --check

  coverage:
    name: rust coverage gate (ubuntu)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # llvm-tools-preview 提供 llvm-profdata/llvm-cov（覆盖率合并所需）。
      - uses: ./.github/actions/panta-toolchain
        with:
          components: "llvm-tools-preview"

      - uses: ./.github/actions/panta-cache-restore

      # 全局阶段下限，不等于逐模块/逐提交防下降；具体边界见
      # ai-docs/modules/quality-tooling.md。launcher 暂不纳入 Rust 插桩链。
      # 使用与固定 rustc 配套的 llvm-tools-preview；branch 数据尚未采集。
      - name: Coverage gate
        shell: bash
        run: cargo coverage

  native-coverage:
    name: native C++ coverage and QML tests (ubuntu)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain

      # 除链接期 GL 头文件外，QML 行为测试运行还需 libEGL/libxkbcommon
      # 运行库与软件渲染驱动。
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gl-prereqs

      - uses: ./.github/actions/panta-cache-restore

      - name: Run native tests and report with managed LLVM
        shell: bash
        run: cargo coverage native

      - name: Upload native coverage report
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: target/native-coverage/summary.txt
          if-no-files-found: error

  check:
    name: cargo check and build (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # Windows 冷启动含 LLVM 2 GiB 归档下载解包与全量 native 构建。
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/panta-toolchain
        with:
          components: "rustfmt,clippy"

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-gl-prereqs

      - uses: ./.github/actions/panta-cache-restore

      # 大型新 exe 构建加速的常规做法（任务 007 轮 4 已证 Defender 不是
      # 测试挂起根因，豁免保留但不再作为修复）；仅影响本 runner。
      - if: runner.os == 'Windows'
        name: Disable Defender real-time scanning for fresh build outputs
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Check workspace and all aggregated targets
        run: cargo check --locked --workspace --all-targets

      - name: Build workspace and native targets
        run: cargo build --locked --workspace

      # 取证步（任务 007 验证表 2026-09-20）：轮 5 发现同名 exe 在构建树中
      # 可能有多份（缓存恢复的陈旧产物 1.6MB 无 VTK，退出码 0xC0000135），
      # 与 ctest 实际拉起的含 VTK 大 exe 不是同一文件。本轮对准权威路径：
      # 枚举全部同名 exe（路径/大小/时间戳）、解析 CTestTestfile.cmake 里
      # add_test 注册的绝对路径、对注册 exe 直接拉起（.NET 真实句柄 + 管道
      # stdio + 25s 有界）取退出码与部分输出、llvm-readobj 导出其导入表。
      # 仅取证——不改变 job 结果。
      - if: runner.os == 'Windows'
        name: Probe VTK-linked test executables directly
        shell: powershell
        run: |
          try {
            $env:PATH = "$PWD\target\panta-deps\qt\staging\bin;$env:PATH"
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:QT_FORCE_STDERR_LOGGING = "1"
            "--- all panta_qml_*_test.exe under target\native:"
            Get-ChildItem -Path "target\native" -Recurse `
              -Filter "panta_qml_*_test.exe" -ErrorAction SilentlyContinue |
              Select-Object FullName, Length, LastWriteTime | Format-List
            "--- add_test registrations for Qml tests:"
            Get-ChildItem "target\native" -Recurse -Filter "CTestTestfile.cmake" |
              Select-String -Pattern "Qml\.(Shell|Viewport)" |
              Select-Object -First 6 -ExpandProperty Line
            $registered = (Get-ChildItem "target\native" -Recurse `
              -Filter "CTestTestfile.cmake" |
              Select-String -Pattern "add_test\(Qml\.ShellModuleLoads[^\)]*" |
              Select-Object -First 1).Line
            "registered line: $registered"
            $target = [regex]::Match($registered, '"([^"]+)"').Groups[1].Value
            if (-not (Test-Path $target)) {
              $target = [regex]::Match($registered, '\s(\S+\.exe)').Groups[1].Value
            }
            "launching registered exe: $target exists=$(Test-Path $target)"
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $target
            $psi.WorkingDirectory = Split-Path $target
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.RedirectStandardInput = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if ($p.WaitForExit(25000)) {
              "registered exe: exited code=$($p.ExitCode)"
            } else {
              "registered exe: STILL RUNNING 25s; killing"; $p.Kill()
            }
            "--- stderr:"; $errTask.Result
            "--- stdout:"; $outTask.Result
            $readobj = Get-ChildItem "target\panta-tools" -Recurse `
              -Filter "llvm-readobj.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($readobj -and (Test-Path $target)) {
              "--- PE imports of registered exe:"
              & $readobj.FullName --needed-libs $target 2>&1 |
                Select-String "Name:" | Select-Object -First 30
            }
          } catch {
            "probe step error (non-fatal): $_"
          }
          exit 0

      - name: Verify Cargo-provisioned toolchain
        shell: bash
        run: cargo run --locked --package panta-tests -- toolchain

      - name: Test
        run: cargo test --locked --workspace

      - uses: ./.github/actions/panta-cache-save

