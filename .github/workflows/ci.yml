# 质量与构建门禁（任务 011/018/032）：
# - quality：依赖审计（RustSec/许可证/重复与通配）与未使用依赖检查，单平台；
# - coverage：Rust 函数 89% / 行 92% 阶段下限；100% 目标尚未达成。
# - rust：三平台完整构建、测试、格式与 clippy 门禁。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: cargo quality (deny, machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal

      # 固定版本见 ai-docs/modules/quality-tooling.md（任务 032）；升级必须
      # 同 commit 更新此处的 --version 与规范。
      - name: Install pinned quality tools
        shell: bash
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-machete --locked --version 0.9.2

      - name: Dependency and license audit
        shell: bash
        run: cargo deny check

      - name: Unused dependency check
        shell: bash
        run: cargo machete

  coverage:
    name: rust coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          # llvm-tools-preview 提供 llvm-profdata/llvm-cov（覆盖率合并所需）。
          rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview

      - name: Install pinned coverage tool
        shell: bash
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      # 全局阶段下限，不等于逐模块/逐提交防下降；具体边界见
      # ai-docs/modules/quality-tooling.md。launcher 暂不纳入 Rust 插桩链。
      # 使用与固定 rustc 配套的 llvm-tools-preview；branch 数据尚未采集。
      - name: Coverage gate
        shell: bash
        run: cargo llvm-cov --locked --workspace --exclude panta-launcher --summary-only --fail-under-functions 89 --fail-under-lines 92

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_generator: Ninja
            cache_compiler: apple-clang-17
          - os: ubuntu-latest
            cmake_generator: Ninja
            cache_compiler: gcc-rhel9
          - os: windows-2022
            cmake_generator: Visual Studio 17 2022
            cmake_generator_platform: x64
            cache_compiler: msvc2022
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.cmake_generator_platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux graphics development package
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dev

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Cache Cargo and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: panta-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_compiler }}-${{ matrix.cmake_generator }}-${{ matrix.cmake_generator_platform }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ci.yml', 'native/CMakePresets.json', 'native/**/*.cmake', 'native/**/CMakeLists.txt', 'qml/**/*.cmake', 'qml/CMakeLists.txt') }}
          restore-keys: |
            panta-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_compiler }}-${{ matrix.cmake_generator }}-

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
