name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_generator: Ninja
          - os: ubuntu-latest
            cmake_generator: Ninja
          - os: windows-2022
            cmake_generator: Visual Studio 17 2022
            cmake_generator_platform: x64
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.cmake_generator_platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux graphics development package
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dev

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Build FFI static library
        run: cargo build --locked -p panta-ffi

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets
