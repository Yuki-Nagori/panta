# 质量与构建门禁（任务 011/018/032/043）：
# - check：唯一跨平台 job；每个平台都执行 check、build、test；
# - lint：Ubuntu 上每个工具独立成一个矩阵检查，失败项可直接定位；
# - format：Ubuntu 上通过 cargo format 检查 Rust、C++/CXX、CMake、QML；
# - dependency-audit：Ubuntu 上执行 RustSec、许可证、重复与通配审计；
# - coverage：Ubuntu 上分别执行 Rust 门禁与 native C++ 插桩报告与 QML 行为测试。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: cargo audit (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal

      - name: Dependency and license audit
        shell: bash
        run: cargo audit

  lint:
    name: cargo lint (${{ matrix.tool }}, ubuntu)
    strategy:
      fail-fast: false
      matrix:
        tool: [clippy, machete, cmake, qmllint, clang-tidy, includes, cppcheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Run selected lint
        shell: bash
        run: cargo lint "${{ matrix.tool }}"

  format:
    name: cargo format (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt

      - name: Run aggregated cargo format (Rust, C++/CXX, CMake and QML)
        shell: bash
        run: cargo format

  coverage:
    name: rust coverage gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          # llvm-tools-preview 提供 llvm-profdata/llvm-cov（覆盖率合并所需）。
          rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview

      # 全局阶段下限，不等于逐模块/逐提交防下降；具体边界见
      # ai-docs/modules/quality-tooling.md。launcher 暂不纳入 Rust 插桩链。
      # 使用与固定 rustc 配套的 llvm-tools-preview；branch 数据尚未采集。
      - name: Coverage gate
        shell: bash
        run: cargo coverage

  native-coverage:
    name: native C++ coverage and QML tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal

      - name: Run native tests and report with managed LLVM
        shell: bash
        run: cargo coverage native

      - name: Upload native coverage report
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: target/native-coverage/summary.txt
          if-no-files-found: error

  check:
    name: cargo check, build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Cache Cargo and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: panta-${{ runner.os }}-${{ runner.arch }}-llvm-22.1.7-ninja-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ci.yml', 'native/CMakePresets.json', 'crates/panta-build/src/*.rs', 'native/**/*.cmake', 'native/**/CMakeLists.txt', 'qml/**/*.cmake', 'qml/CMakeLists.txt') }}
          restore-keys: |
            panta-${{ runner.os }}-${{ runner.arch }}-llvm-22.1.7-ninja-

      - name: Check workspace and all aggregated targets
        run: cargo check --locked --workspace --all-targets

      - name: Build workspace and native targets
        run: cargo build --locked --workspace

      - name: Verify Cargo-provisioned toolchain
        shell: bash
        run: cargo run --locked --package panta-tests -- toolchain

      - name: Test
        run: cargo test --locked
