name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: cargo quality (deny, machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal

      # 固定版本见 ai-docs/modules/quality-tooling.md（任务 032）；升级必须
      # 同 commit 更新此处的 --version 与规范。
      - name: Install pinned quality tools
        shell: bash
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-machete --locked --version 0.9.2

      - name: Dependency and license audit
        shell: bash
        run: cargo deny check

      - name: Unused dependency check
        shell: bash
        run: cargo machete

  coverage:
    name: rust coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          # llvm-tools-preview 提供 llvm-profdata/llvm-cov（覆盖率合并所需）。
          rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview

      - name: Install pinned coverage tool
        shell: bash
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      # 覆盖率报告（任务 032）：launcher（启动胶水）按登记理由排除，C++
      # 覆盖率另行测量。当前为基线报告；100% line 门禁在缺口清零后启用
      # （032 记录：panta-dslc 0%、panta-dsl-core 66.94% 为主要缺口）。
      - name: Coverage report
        shell: bash
        run: cargo llvm-cov --locked --workspace --exclude panta-launcher --summary-only

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_generator: Ninja
            cache_compiler: apple-clang-17
          - os: ubuntu-latest
            cmake_generator: Ninja
            cache_compiler: gcc-rhel9
          - os: windows-2022
            cmake_generator: Visual Studio 17 2022
            cmake_generator_platform: x64
            cache_compiler: msvc2022
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.cmake_generator_platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux graphics development package
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dev

      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/{print $2}' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Cache Cargo and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: panta-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_compiler }}-${{ matrix.cmake_generator }}-${{ matrix.cmake_generator_platform }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ci.yml', 'native/CMakePresets.json', 'native/**/*.cmake', 'native/**/CMakeLists.txt', 'qml/**/*.cmake', 'qml/CMakeLists.txt') }}
          restore-keys: |
            panta-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_compiler }}-${{ matrix.cmake_generator }}-

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
