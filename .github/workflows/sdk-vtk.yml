# VTK 预编译 SDK 生产管线（任务 038；workflow_dispatch 手动触发）。
#
# 受信 CI 语义：按 tools/sdk/ 冻结的构建描述生产制品，自检通过后上传
# 构建产物；`publish` 输入为 true 时把归档与 .sha256 发布到 GitHub
# Release（tag = sdk-vtk-9.7.0-webgpu），发布说明含源码 pin 与许可证出处
# （tools/sdk/releases/vtk-9.7.0.md）。开发者与普通 CI 经 031 的
# sdk-provision 消费发布归档，不在本地编译 VTK 源码。
#
# runner 工具链：cmake/ninja 为 runner 镜像预装组件（生产管线的受信
# 环境，不是开发者基线）；VTK 制品不消费 Qt，Qt Quick 由应用侧另行供给。

name: SDK artifacts (VTK)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 发布到 GitHub Release（tag sdk-vtk-9.7.0-webgpu）
        type: boolean
        default: false

concurrency:
  group: sdk-vtk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  vtk:
    name: vtk 9.7.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmake_generator: Ninja
            sdk_triple: macos-arm64
          - os: ubuntu-latest
            cmake_generator: Ninja
            sdk_triple: linux-x86_64
          - os: windows-2022
            cmake_generator: Visual Studio 17 2022
            cmake_generator_platform: x64
            sdk_triple: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.cmake_generator_platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux window-system development packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Produce VTK SDK
        shell: bash
        run: |
          cmake -S tools/sdk -B sdk-build/superbuild \
            -DPANTA_SDK_ENABLE_OCCT=OFF \
            -DPANTA_SDK_ENABLE_NETGEN=OFF
          cmake --build sdk-build/superbuild --target vtk_sdk

      - name: Selfcheck artifact
        shell: bash
        run: |
          cmake -S tools/sdk/selfcheck -B sdk-build/selfcheck \
            -DPSDK_ROOT="$PWD/sdk-build/superbuild/out/vtk/9.7.0/${{ matrix.sdk_triple }}" \
            -DPSDK_PACKAGE=VTK \
            -DPSDK_REQUIRED_TARGETS="VTK::RenderingWebGPU VTK::RenderingUI"

      - name: Package artifact
        shell: bash
        run: |
          cmake -DPKG_ROOT="$PWD/sdk-build/superbuild/out/vtk/9.7.0/${{ matrix.sdk_triple }}" \
            -DPKG_NAME=vtk -DPKG_VERSION=9.7.0 \
            -DPKG_TRIPLE=${{ matrix.sdk_triple }} \
            -DPKG_DIST="$PWD/sdk-build/dist" \
            -P tools/sdk/package.cmake

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: vtk-9.7.0-${{ matrix.sdk_triple }}
          path: sdk-build/dist/*
          if-no-files-found: error

      - name: Publish release assets
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 矩阵各平台并发：Release 不存在则创建（发布说明含许可证/源码
          # 出处），资产以 --clobber 重复上传幂等。
          gh release view sdk-vtk-9.7.0-webgpu --repo "$GITHUB_REPOSITORY" \
            || gh release create sdk-vtk-9.7.0-webgpu \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "VTK 9.7.0 WebGPU/Cocoa prebuilt SDKs" \
                 --notes-file tools/sdk/releases/vtk-9.7.0.md
          gh release upload sdk-vtk-9.7.0-webgpu sdk-build/dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
