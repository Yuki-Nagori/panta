# 保存托管缓存（任务 012/046）。仅 ci.yml check job 在 main push 时调用；
# PR 只恢复不保存，避免条目按 PR 数量膨胀。缓存瘦身在供给层完成：
# panta-build 安装归档发布即删并按白名单裁剪 LLVM，Qt/SDK CMake 供给发布
# 即删归档；cargo-home 键不缓存 registry src/ 解包副本。改键时与
# panta-cache-restore 两处必须同步。
name: Save panta caches
description: 输出缓存体积并保存 cargo-home 与 tools/deps 两键缓存
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        du -sh target/panta-tools target/panta-deps ~/.cargo/registry 2>/dev/null || true

    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ~/.cargo/git/checkouts
        key: cargo-home-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

    - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          target/panta-tools
          target/panta-deps
        key: panta-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/panta-build/Cargo.toml', 'crates/panta-build/src/*.rs', 'native/CMakeLists.txt', 'native/cmake/*.cmake', 'native/cmake/**/*.cmake') }}
